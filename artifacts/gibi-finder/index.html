<!DOCTYPE html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    <title>Gibi Finder</title>
    <meta name="description" content="O buscador e leitor definitivo de quadrinhos e mangás. Encontre, salve em sua estante e leia de forma limpa e sem anúncios." />
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gibi-finder.vercel.app/" />
    <meta property="og:title" content="Gibi Finder - Buscador e Leitor de Quadrinhos" />
    <meta property="og:description" content="O buscador e leitor definitivo de quadrinhos e mangás. Encontre, salve em sua estante e leia de forma limpa e sem anúncios." />
    <meta property="og:image" content="https://gibi-finder.vercel.app/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://gibi-finder.vercel.app/" />
    <meta property="twitter:title" content="Gibi Finder - Buscador e Leitor de Quadrinhos" />
    <meta property="twitter:description" content="O buscador e leitor definitivo de quadrinhos e mangás. Encontre, salve em sua estante e leia de forma limpa e sem anúncios." />
    <meta property="twitter:image" content="https://gibi-finder.vercel.app/opengraph.jpg" />

    <!-- AdSense: verificacao de propriedade e veiculacao. Como o site e uma SPA com um
         unico index.html, esta tag cobre todas as rotas. Ver public/ads.txt. -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3726465981298484"
     crossorigin="anonymous"></script>

    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gibi Finder" />
    <!-- Moved from a CSS @import (index.css) — a blocking <link> resolves
         before the stylesheet that needs it even starts downloading, instead
         of being discovered only after the CSS itself loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

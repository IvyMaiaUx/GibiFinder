    <!-- AdSense: verificacao de propriedade e veiculacao. Como o site e uma SPA com um
         unico index.html, esta tag cobre todas as rotas. Ver public/ads.txt. -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3726465981298484"
     crossorigin="anonymous"></script>

    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gibi Finder" />
    <!-- Moved from a CSS @import (index.css) — a blocking <link> resolves
         before the stylesheet that needs it even starts downloading, instead
         of being discovered only after the CSS itself loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        var supported = ('registerProperty' in CSS) && CSS.supports('color', 'color-mix(in srgb, red, blue)');
        if (!supported) {
          var banner = document.createElement('div');
          banner.id = 'legacy-browser-warning';
          banner.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:999999;background:#FAF7F2;color:#000;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;box-sizing:border-box;';
          banner.innerHTML = '<div style="max-width:380px;background:#FFF;border:4px solid #000;padding:24px;border-radius:12px;box-shadow:6px 6px 0 #000;">' +
            '<div style="font-size:36px;margin-bottom:12px;">⚠️</div>' +
            '<h2 style="font-size:20px;font-weight:800;margin:0 0 8px;text-transform:uppercase;">Navegador Desatualizado</h2>' +
            '<p style="font-size:14px;line-height:1.5;color:#444;margin:0 0 16px;">O Gibi Finder utiliza recursos visuais modernos que requerem o <strong>iOS 16.4 ou superior</strong> (ou uma versão recente do Safari/Chrome).</p>' +
            '<p style="font-size:13px;line-height:1.4;color:#666;margin:0 0 20px;">Por favor, atualize o sistema do seu aparelho em <em>Ajustes > Geral > Atualização de Software</em> para ter a experiência completa.</p>' +
            '<button onclick="document.getElementById(\'legacy-browser-warning\').remove()" style="background:#E63946;color:#FFF;border:3px solid #000;font-weight:800;padding:10px 20px;font-size:14px;border-radius:8px;cursor:pointer;">CONTINUAR MESMO ASSIM</button>' +
            '</div>';
          document.body.appendChild(banner);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
